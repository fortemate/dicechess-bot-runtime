name: "Ops: Release"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump after the latest tag; the first release is always v1.0.0"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Verify release branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be cut from main, got '$GITHUB_REF'"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java and Maven Central credentials
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Validate publishing credentials
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$PGP_SECRET" ] || missing+=(PGP_SECRET)
          [ -n "$PGP_PASSPHRASE" ] || missing+=(PGP_PASSPHRASE)
          [ -n "$SONATYPE_USERNAME" ] || missing+=(SONATYPE_USERNAME)
          [ -n "$SONATYPE_PASSWORD" ] || missing+=(SONATYPE_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing publishing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import GPG signing key
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.gnupg"
          printf '%s' "$PGP_SECRET" | base64 --decode | gpg --batch --yes --import
          echo "allow-loopback-pinentry" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          gpg --batch --list-secret-keys --with-colons | grep -q '^sec:'

      - name: Verify and sign release artifacts
        run: mvn --batch-mode --no-transfer-progress -P release verify
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

      - name: Get latest release tag
        id: latest
        run: |
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Calculate versions
        id: version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          BUMP_TYPE: ${{ inputs.bump }}
        with:
          script: |
            const latestTag = process.env.LATEST_TAG;
            const bumpType = process.env.BUMP_TYPE;
            let major = 1;
            let minor = 0;
            let patch = 0;

            if (latestTag) {
              const match = latestTag.match(/^v(\d+)\.(\d+)\.(\d+)$/);
              if (!match) {
                core.setFailed(`Invalid release tag: ${latestTag}`);
                return;
              }
              major = Number(match[1]);
              minor = Number(match[2]);
              patch = Number(match[3]);
              if (bumpType === 'major') {
                major += 1;
                minor = 0;
                patch = 0;
              } else if (bumpType === 'minor') {
                minor += 1;
                patch = 0;
              } else {
                patch += 1;
              }
            }

            const releaseVersion = `${major}.${minor}.${patch}`;
            core.setOutput('release_version', releaseVersion);
            core.setOutput('release_tag', `v${releaseVersion}`);

      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Publish to Maven Central
        run: mvn --batch-mode --no-transfer-progress -P release clean deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
